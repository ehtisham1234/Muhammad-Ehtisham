<title>Sukhan-e-Dil Batch</title>
<style>
  :root{
    --bg:#f7f4ef; --surface:#ffffff; --text:#241a20; --muted:#6b5f63;
    --accent:#a9773f; --border:#e7ddd0; --urdu-bg:#241226;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#151016; --surface:#1d1720; --text:#f2ece7; --muted:#a89ba0;
      --accent:#c9a26b; --border:#332a35; --urdu-bg:#0f0a12;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#151016; --surface:#1d1720; --text:#f2ece7; --muted:#a89ba0;
    --accent:#c9a26b; --border:#332a35; --urdu-bg:#0f0a12;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding-inline:16px; padding-block:32px; background:var(--bg); color:var(--text);
    font-family:'Source Serif 4', Georgia, serif;
  }
  h1{
    font-family:'Fraunces', Georgia, serif; font-weight:600; font-size:clamp(28px,5vw,44px);
    margin:0 0 6px; text-wrap:balance;
  }
  p.lede{color:var(--muted); margin:0 0 36px; max-width:60ch; font-size:16px;}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:24px;
    max-width:1100px; margin:0 auto;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  video{width:100%; display:block; background:var(--urdu-bg); aspect-ratio:9/16;}
  .meta{padding:14px 16px 18px; display:flex; flex-direction:column; gap:6px;}
  .poet{
    font-family:'Fraunces', Georgia, serif; font-weight:600; color:var(--accent); font-size:17px;
  }
  .gloss{color:var(--muted); font-size:14px; line-height:1.4;}
  .status{
    font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
    padding-top:6px; border-top:1px solid var(--border); margin-top:4px;
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Source+Serif+4:wght@400;500&display=swap">
<body>
  <h1>Sukhan-e-Dil — first batch</h1>
  <p class="lede">Five pipeline-test videos, verified poem text, offline voice + original background art. Reviewing before anything goes out to YouTube, Facebook, or TikTok.</p>
  <div class="grid" id="grid"></div>
  <script>
    const videos = [
      {poet:"Mirza Ghalib", gloss:"Thousands of desires, each worth dying for — many were fulfilled, yet still I wanted more.", src:"VIDEO_GHALIB"},
      {poet:"Rumi (trans. Whinfield, 1887)", gloss:"Hearken to the reed-flute, how it complains, lamenting its banishment from its home.", src:"VIDEO_RUMI"},
      {poet:"Allama Iqbal", gloss:"Raise your Self so high that before every decree of fate, God Himself asks what you want.", src:"VIDEO_IQBAL"},
      {poet:"Mir Taqi Mir", gloss:"Every leaf, every sapling in the garden knows my heart's condition — only the flower pretends not to know.", src:"VIDEO_MIR"},
      {poet:"Hasrat Mohani", gloss:"Quietly, night and day, shedding tears — I still remember that season of love.", src:"VIDEO_HASRAT"},
    ];
    const grid = document.getElementById("grid");
    for (const v of videos) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <video src="${v.src}" controls preload="metadata" playsinline></video>
        <div class="meta">
          <div class="poet">${v.poet}</div>
          <div class="gloss">${v.gloss}</div>
          <div class="status">Awaiting review</div>
        </div>`;
      grid.appendChild(card);
    }
  </script>
</body>
